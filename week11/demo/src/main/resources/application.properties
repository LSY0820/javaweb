spring.application.name=demo

# 4주차: MySQL 접속 정보 (기본 포트 3306, 데이터베이스 이름 spring)
spring.datasource.url=jdbc:mysql://localhost:3306/spring?serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 5주차: DB 계정 정보(아이디·비밀번호)는 application-secret.properties 로 분리 (깃에 안 올라감, .gitignore)
spring.config.import=optional:application-secret.properties

# 7주차: 오류 JSON 에 서버 내부 정보(trace)를 넣지 않음 (개발 도구가 켜도 실서비스처럼 숨김)
server.error.include-stacktrace=never

# [11주차] 단계 2 : 파일 업로드 크기 (기본값 : 파일 1MB, 요청 전체 10MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
